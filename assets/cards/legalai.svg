<svg xmlns="http://www.w3.org/2000/svg" width="440" height="190" viewBox="0 0 440 190" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e17"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  
</defs>
<style>
  .fade{opacity:0;animation:fade .5s ease-out forwards}
  .up{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
  .blink{animation:blink 1s steps(1) infinite}
  .pulse{animation:pulse 6s ease-in-out infinite}
  .twinkle{opacity:0;animation:twinkle 3.2s ease-in-out infinite}
  @keyframes fade{to{opacity:1}}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes blink{50%{opacity:0}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.6}}
  @keyframes twinkle{0%,70%,100%{opacity:0;transform:scale(.4)}80%{opacity:1;transform:scale(1)}}
  
</style>
<rect x=".5" y=".5" width="439" height="189" rx="16" fill="url(#bg)" stroke="#1f2937"/>
<rect x=".5" y=".5" width="439" height="189" rx="16" fill="url(#grid)"/>
<circle cx="410" cy="20" r="70" fill="#fbbf24" fill-opacity=".22" filter="url(#blur)"/>
<rect x="20" y="20" width="123" height="22" rx="11" fill="#fbbf24" fill-opacity=".12" stroke="#fbbf24" stroke-opacity=".5"/>
<text x="81" y="35" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="700" letter-spacing=".5" fill="#fbbf24">HACKSMU WINNER</text>
<text x="418" y="38" text-anchor="end" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#6b7280">↗</text>
<text x="20" y="74" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#e5e7eb">LegalAI</text>
<text x="20" y="100" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9ca3af">Reviews contracts and legal documents with AI, flagging</text>
<text x="20" y="119" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9ca3af">risks, ambiguities and inconsistencies in seconds.</text>
<rect x="20" y="155" width="85" height="20" rx="5" fill="#a78bfa" fill-opacity=".10"/><text x="62" y="169" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#a78bfa">TypeScript</text>
<rect x="112" y="155" width="45" height="20" rx="5" fill="#22d3ee" fill-opacity=".10"/><text x="134" y="169" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" fill="#22d3ee">LLMs</text>
</svg>
