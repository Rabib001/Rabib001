<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e17"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  
  <clipPath id="type"><rect x="52" y="56" width="0" height="26">
    <animate attributeName="width" from="0" to="385" begin="0.3s" dur="1.3s" fill="freeze" calcMode="discrete"
      values="0;9;19;28;38;47;56;66;75;85;94;103;113;122;132;141;150;160;169;179;188;197;207;216;226;235;244;254;263;273;282;291;301;310;320;329;338;348;357;367;376;385"/>
  </rect></clipPath>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#4ade80"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
  .fade{opacity:0;animation:fade .5s ease-out forwards}
  .up{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
  .blink{animation:blink 1s steps(1) infinite}
  .pulse{animation:pulse 6s ease-in-out infinite}
  .twinkle{opacity:0;animation:twinkle 3.2s ease-in-out infinite}
  @keyframes fade{to{opacity:1}}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes blink{50%{opacity:0}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.6}}
  @keyframes twinkle{0%,70%,100%{opacity:0;transform:scale(.4)}80%{opacity:1;transform:scale(1)}}
  
</style>
<rect x=".5" y=".5" width="899" height="399" rx="16" fill="url(#bg)" stroke="#1f2937"/>
<rect x=".5" y=".5" width="899" height="399" rx="16" fill="url(#grid)"/>

<circle cx="140" cy="60" r="140" fill="#a78bfa" filter="url(#blur)" class="pulse"/>
<circle cx="800" cy="360" r="150" fill="#22d3ee" filter="url(#blur)" class="pulse" style="animation-delay:-3s"/>
<rect x=".5" y=".5" width="899" height="399" rx="16" fill="#0a0e17" fill-opacity=".55"/>
<line x1="0" y1="44" x2="900" y2="44" stroke="#1f2937"/>
<circle cx="26" cy="22" r="6" fill="#ff5f57"/><circle cx="46" cy="22" r="6" fill="#febc2e"/><circle cx="66" cy="22" r="6" fill="#28c840"/>
<text x="450.0" y="27" text-anchor="middle" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" fill="#6b7280">rabib@austin: ~/agents</text>
<g font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="15">
  <text x="34" y="74" fill="#4ade80">$</text>
  <text x="52" y="74" fill="#e5e7eb" clip-path="url(#type)">orchestrator run --task &quot;introduce rabib&quot;</text>
</g>
<g class="fade" style="animation-delay:4.35s">
  <line x1="34" y1="268" x2="866" y2="268" stroke="#1f2937" stroke-dasharray="4 6"/>
</g>
<g class="up" style="animation-delay:4.35s">
  <text x="32" y="330" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Rabib Husain</text>
</g>
<g class="up" style="animation-delay:4.65s" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="15">
  <text x="34" y="368" fill="#9ca3af">I build LLM agents, and the backends they run on.</text>
</g>
<rect x="495" y="355" width="9" height="17" fill="#4ade80" class="blink"/>
<g class="fade" style="animation-delay:1.90s" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="14.5"><text x="34" y="104" fill="#22d3ee">→</text><text x="56" y="104" fill="#6b7280">education</text><text x="170" y="104" fill="#e5e7eb">UT Arlington · Honors B.S. Computer Science &#x27;26</text><text x="866" y="104" fill="#4ade80" text-anchor="end">ok</text></g><g class="fade" style="animation-delay:2.25s" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="14.5"><text x="34" y="129" fill="#22d3ee">→</text><text x="56" y="129" fill="#6b7280">role[0]</text><text x="170" y="129" fill="#e5e7eb">Founding Engineer @ Spaceodd</text><text x="866" y="129" fill="#4ade80" text-anchor="end">ok</text></g><g class="fade" style="animation-delay:2.60s" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="14.5"><text x="34" y="154" fill="#22d3ee">→</text><text x="56" y="154" fill="#6b7280">role[1]</text><text x="170" y="154" fill="#e5e7eb">ML/LLM Intern @ University Lands / UT System</text><text x="866" y="154" fill="#4ade80" text-anchor="end">ok</text></g><g class="fade" style="animation-delay:2.95s" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="14.5"><text x="34" y="179" fill="#22d3ee">→</text><text x="56" y="179" fill="#6b7280">focus</text><text x="170" y="179" fill="#e5e7eb">LLM agents · multi-agent systems · backend infra</text><text x="866" y="179" fill="#4ade80" text-anchor="end">ok</text></g><g class="fade" style="animation-delay:3.30s" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="14.5"><text x="34" y="204" fill="#22d3ee">→</text><text x="56" y="204" fill="#6b7280">trophies</text><text x="170" y="204" fill="#e5e7eb">7 hackathon wins, incl. Cal Hacks</text><text x="866" y="204" fill="#4ade80" text-anchor="end">ok</text></g><g class="fade" style="animation-delay:3.65s" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="14.5"><text x="34" y="229" fill="#22d3ee">→</text><text x="56" y="229" fill="#6b7280">location</text><text x="170" y="229" fill="#e5e7eb">Austin, TX</text><text x="866" y="229" fill="#4ade80" text-anchor="end">ok</text></g>

</svg>
