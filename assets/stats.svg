<svg xmlns="http://www.w3.org/2000/svg" width="900" height="116" viewBox="0 0 900 116" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e17"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  
</defs>
<style>
  .fade{opacity:0;animation:fade .5s ease-out forwards}
  .up{opacity:0;animation:up .6s cubic-bezier(.2,.8,.2,1) forwards}
  .blink{animation:blink 1s steps(1) infinite}
  .pulse{animation:pulse 6s ease-in-out infinite}
  .twinkle{opacity:0;animation:twinkle 3.2s ease-in-out infinite}
  @keyframes fade{to{opacity:1}}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes blink{50%{opacity:0}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.6}}
  @keyframes twinkle{0%,70%,100%{opacity:0;transform:scale(.4)}80%{opacity:1;transform:scale(1)}}
  
</style>
<rect x=".5" y=".5" width="899" height="115" rx="16" fill="url(#bg)" stroke="#1f2937"/>
<rect x=".5" y=".5" width="899" height="115" rx="16" fill="url(#grid)"/>
<g class="up" style="animation-delay:0.00s">
  <rect x="18" y="16" width="204" height="84" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#1f2937"/>
  <rect x="18" y="30" width="3" height="56" rx="1.5" fill="#fbbf24"/>
  <text x="38" y="60" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#fbbf24">7×</text>
  <text x="38" y="78" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#9ca3af">hackathon wins</text>
  <text x="38" y="92" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#9ca3af">incl. Cal Hacks</text>
</g>
<g class="up" style="animation-delay:0.15s">
  <rect x="234" y="16" width="204" height="84" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#1f2937"/>
  <rect x="234" y="30" width="3" height="56" rx="1.5" fill="#a78bfa"/>
  <text x="254" y="60" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#a78bfa">70+</text>
  <text x="254" y="78" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#9ca3af">beta users at the</text>
  <text x="254" y="92" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#9ca3af">Spaceodd launch</text>
</g>
<g class="up" style="animation-delay:0.30s">
  <rect x="450" y="16" width="204" height="84" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#1f2937"/>
  <rect x="450" y="30" width="3" height="56" rx="1.5" fill="#22d3ee"/>
  <text x="470" y="60" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#22d3ee">8</text>
  <text x="470" y="78" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#9ca3af">developers run the agent</text>
  <text x="470" y="92" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#9ca3af">orchestrator I built</text>
</g>
<g class="up" style="animation-delay:0.45s">
  <rect x="666" y="16" width="204" height="84" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#1f2937"/>
  <rect x="666" y="30" width="3" height="56" rx="1.5" fill="#4ade80"/>
  <text x="686" y="60" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#4ade80">3.5 yrs</text>
  <text x="686" y="78" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#9ca3af">teaching CS as a</text>
  <text x="686" y="92" font-family="'SF Mono','Cascadia Code',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#9ca3af">PLTL peer leader</text>
</g>
</svg>
